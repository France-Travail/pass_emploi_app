name: pass_emploi_app
description: Pass Emploi iOS and Android app.

publish_to: "none"
# 1j1s branch in on this version - no tag assigned
version: 5.1.4

environment:
  sdk: 3.13.7 # Dart version
  flutter: 3.47.9

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  # Dart
  collection: ^1.19.1
  equatable: ^3.0.0
  synchronized: ^3.5.0
  uuid: ^4.6.0
  clock: ^1.1.3
  # Dio
  dio: ^5.11.1
  dio_cache_interceptor: ^4.0.7
  http_cache_file_store: "2.0.2"
  http_parser: "4.1.2"

  # Firebase
  firebase_core: "5.1.0"
  firebase_crashlytics: "6.0.1"
  firebase_remote_config: "7.0.1"
  firebase_messaging: "17.0.1"
  firebase_auth: "7.0.1"
  firebase_app_installations: "0.5.1"
  cloud_firestore: "7.1.0" # >= 7.1.0 requis : faille eMudhra (CA intermédiaire compromise)

  # UI
  flutter_svg: ^2.3.2
  smooth_page_indicator: ^3.0.0
  path_provider: ^2.1.6
  flutter_staggered_animations: "1.1.1"
  shimmer: "4.0.0"
  confetti: ^0.8.0
  dotted_border: "3.1.0"
  flutter_linkify: "6.0.0"
  showcaseview: "5.1.0"
  flutter_dsfr:
    git:
      url: https://github.com/Octo-Open-Source/flutter-dsfr.git
      ref: 0.5.0
  # Native features
  webview_flutter: "4.14.1"
  flutter_local_notifications: ^22.3.3
  flutter_appauth: ^13.0.0
  flutter_secure_storage: ^11.2.0
  url_launcher: ^6.3.3
  share_plus: ^13.3.1
  open_filex: ^5.0.0
  in_app_review: ^2.0.12
  flutter_timezone: ^5.1.1
  connectivity_plus: ^7.3.1
  image_picker: ^1.2.4
  flutter_image_compress: ^2.5.1
  file_picker: ^13.3.2
  app_settings: ^9.0.1
  geolocator: ^14.1.2
  # Others
  flutter_redux: "0.10.0"
  redux: "5.0.0"
  flutter_dotenv: ^6.0.1
  package_info_plus: ^10.2.2
  encrypt: ^5.0.3
  logger: ^2.8.0
  matomo_tracker: ^6.1.1
  speech_to_text: ^7.5.0
  gaimon: ^1.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Assets generation
  flutter_native_splash: ^2.4.8
  flutter_launcher_icons: ^0.14.4
  # Test
  mocktail: ^1.0.5
  http_mock_adapter: "0.6.1"
  async: "2.13.1"
  # Static analysis
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/dsfr/
    - assets/tuto/
    - assets/illustrations/
    - assets/mode_demo/
    - assets/mode_demo/brsa/
    - assets/mode_demo/cej/
    - env/

  fonts:
    - family: AppIconsAdditional
      fonts:
        - asset: fonts/AppIconsAdditional.ttf
    - family: Marianne
      fonts:
        - asset: fonts/Marianne-Regular.otf
        - asset: fonts/Marianne-Regular.otf
          weight: 400
        - asset: fonts/Marianne-Medium.otf
          weight: 500
        - asset: fonts/Marianne-Bold.otf
          weight: 700
