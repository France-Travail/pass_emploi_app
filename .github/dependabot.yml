version: 2

updates:
  # ===========================================
  # Pub (Flutter/Dart)
  # ===========================================
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: daily
      time: '07:00'
      timezone: Europe/Paris
    open-pull-requests-limit: 15
    commit-message:
      prefix: 'chore(deps):'
    allow:
      - update-types:
          - version-update:semver-patch
          - version-update:semver-minor
    groups:
      # Production dependencies - patch and minor
      prod-minor-patch:
        applies-to: version-updates
        dependency-type: production
        update-types:
          - patch
          - minor
      # Development dependencies - patch and minor
      dev-minor-patch:
        applies-to: version-updates
        dependency-type: development
        update-types:
          - patch
          - minor
      # Majors : pas de groupe, chaque dépendance a sa propre PR

  # ===========================================
  # Gradle (Android)
  # ===========================================
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: daily
      time: '07:00'
      timezone: Europe/Paris
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'chore(deps):'
    allow:
      - update-types:
          - version-update:semver-patch
          - version-update:semver-minor
    groups:
      # Dependencies - patch and minor
      gradle-minor-patch:
        applies-to: version-updates
        update-types:
          - patch
          - minor

  # ===========================================
  # GitHub Actions
  # ===========================================
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
      time: '07:00'
      timezone: Europe/Paris
    commit-message:
      prefix: 'ci(deps):'
    groups:
      # GitHub Actions - patch and minor
      actions-minor-patch:
        applies-to: version-updates
        update-types:
          - patch
          - minor
      # Majors : pas de groupe, chaque action a sa propre PR
