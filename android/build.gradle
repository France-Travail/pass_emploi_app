allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}

// Define Flutter properties globally for plugins
ext {
    flutter = [
        compileSdkVersion: 36,
        minSdkVersion: 24,
        targetSdkVersion: 36,
        ndkVersion: '28.2.13676358'
    ]
}

rootProject.layout.buildDirectory = file('../build')
subprojects {
    project.layout.buildDirectory = rootProject.layout.buildDirectory.dir(project.name)
    // See https://stackoverflow.com/a/77738936
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            project.android {
                if (namespace == null) {
                    namespace project.group
                }
            }
        }
    }
}
// Flutter Gradle plugin (applied in :app) registers the `flutter` extension used by some plugins (e.g. android_file_picker)
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}
